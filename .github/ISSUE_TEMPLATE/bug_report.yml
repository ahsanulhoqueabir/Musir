name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Describe the bug and what you expected.}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Open...\n2. Tap..."}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Musir version, placeholder: 1.0.1}
  - type: input
    id: device
    attributes: {label: Device and Android version, placeholder: Pixel 7, Android 14}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots}
